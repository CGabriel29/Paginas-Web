<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sorpresa de Primavera ✨</title>
    
    <!-- Librerías Externas -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Montserrat:ital,wght@0,300;0,400;0,600;1,400&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-dark: #050505;
            --bg-deep: #0a1128;
            --gold-light: #fef08a;
            --gold-glow: #eab308;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: radial-gradient(circle at center, var(--bg-deep) 0%, var(--bg-dark) 100%);
            color: #f1f5f9;
            font-family: 'Montserrat', sans-serif;
        }

        .font-cinzel { font-family: 'Cinzel', serif; }

        /* Efecto de partículas/estrellas de fondo */
        .sparks-container {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 0;
            pointer-events: none;
            overflow: hidden;
        }
        
        .spark {
            position: absolute;
            background-color: var(--gold-light);
            border-radius: 50%;
            animation: float-up var(--duration) linear infinite;
            opacity: 0;
            box-shadow: 0 0 8px 2px rgba(254, 240, 138, 0.4);
        }

        @keyframes float-up {
            0% { opacity: 0; transform: translateY(100vh) scale(0.5); }
            50% { opacity: var(--max-opacity); transform: translateY(50vh) scale(1); }
            100% { opacity: 0; transform: translateY(-10vh) scale(0.5); }
        }

        .glass-panel {
            background: rgba(10, 17, 40, 0.6);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(234, 179, 8, 0.2);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.7);
        }

        #flower-svg {
            width: 100%;
            height: 100%;
            max-height: 65vh;
            filter: drop-shadow(0 15px 35px rgba(234, 179, 8, 0.15));
        }

        /* Comportamiento de los pétalos */
        .petal-group {
            transform-origin: 0px 0px;
            transform: scale(0);
            transition: transform 1.2s cubic-bezier(0.34, 1.56, 0.64, 1);
            cursor: pointer;
        }
        
        .petal-group.bloom {
            transform: scale(1);
        }

        /* Resplandor al pasar el mouse por un pétalo (solo cuando la flor está completa) */
        .flower-complete .petal-group:hover path.petal-shape {
            filter: drop-shadow(0 0 15px rgba(253, 224, 71, 0.9));
            stroke: #fef08a;
            stroke-width: 1.5;
        }

        @keyframes pulse-glow-gold {
            0% { transform: scale(0.8); opacity: 0.3; filter: drop-shadow(0 0 3px #fde047); }
            100% { transform: scale(1.4); opacity: 0.9; filter: drop-shadow(0 0 10px #eab308); }
        }
        
        .link-indicator {
            transform-origin: center;
            opacity: 0;
            transition: opacity 0.5s;
        }
        
        .flower-complete .link-indicator {
            opacity: 1;
            animation: pulse-glow-gold 1.5s infinite alternate;
        }

        /* Botón estilo Dorado Elegante */
        .magic-btn {
            background: linear-gradient(135deg, #d97706, #a16207);
            box-shadow: 0 4px 15px rgba(217, 119, 6, 0.4), inset 0 0 10px rgba(255,255,255,0.2);
            border: 1px solid #fde047;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .magic-btn:hover:not(:disabled) {
            transform: translateY(-2px) scale(1.02);
            box-shadow: 0 6px 25px rgba(234, 179, 8, 0.6), inset 0 0 15px rgba(255,255,255,0.3);
            background: linear-gradient(135deg, #eab308, #d97706);
        }
        .magic-btn:disabled {
            background: rgba(255, 255, 255, 0.05);
            box-shadow: none;
            cursor: not-allowed;
            color: #94a3b8;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        /* Barras de progreso */
        .progress-container {
            width: 100%;
            background: rgba(0, 0, 0, 0.5);
            border-radius: 999px;
            height: 4px;
            overflow: hidden;
            margin-top: 15px;
            box-shadow: inset 0 1px 3px rgba(0,0,0,0.8);
        }
        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #ca8a04, #eab308, #fde047);
            width: 0%;
            transition: width 0.6s ease;
            box-shadow: 0 0 10px #eab308;
        }

        /* Modal Elegante */
        #modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }
        #modal-overlay {
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
        }
        #modal-content {
            transform: scale(0.95) translateY(20px);
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        #modal-overlay.active #modal-content {
            transform: scale(1) translateY(0);
        }
    </style>
</head>
<body class="flex flex-col relative">

    <div class="sparks-container" id="sparks"></div>

    <header class="relative z-10 p-5 md:p-6 mx-4 mt-8 rounded-2xl glass-panel max-w-2xl md:mx-auto text-center border-t border-yellow-500/30">
        <!-- Destellos SVG limpios alrededor del título -->
        <div class="flex items-center justify-center gap-3 mb-2">
            <svg class="w-6 h-6 text-yellow-400 drop-shadow-[0_0_8px_rgba(253,224,71,0.8)]" viewBox="0 0 24 24" fill="currentColor"><path d="M12 1L14.59 9.41L23 12L14.59 14.59L12 23L9.41 14.59L1 12L9.41 9.41L12 1Z"/></svg>
            <h1 class="font-cinzel text-3xl md:text-4xl lg:text-5xl font-bold tracking-wide drop-shadow-[0_0_15px_rgba(234,179,8,0.3)] text-transparent bg-clip-text bg-gradient-to-r from-yellow-200 via-yellow-400 to-amber-500">
                Sorpresa de Primavera
            </h1>
            <svg class="w-6 h-6 text-yellow-400 drop-shadow-[0_0_8px_rgba(253,224,71,0.8)]" viewBox="0 0 24 24" fill="currentColor"><path d="M12 1L14.59 9.41L23 12L14.59 14.59L12 23L9.41 14.59L1 12L9.41 9.41L12 1Z"/></svg>
        </div>
        <p class="text-sm md:text-base text-gray-300 font-light italic mt-2 mb-2">
            Completa los pétalos de la Flor, luego haz clic en ellos
        </p>
        
        <div class="progress-container">
            <div class="progress-bar" id="progress-bar"></div>
        </div>
        <p class="text-[10px] text-yellow-500 mt-2 tracking-[0.2em] font-semibold" id="progress-text">0 / 10 PÉTALOS</p>
    </header>

    <main class="relative z-10 flex-grow flex items-center justify-center overflow-visible pb-28 md:pb-12">
        <svg id="flower-svg" viewBox="0 0 500 700" preserveAspectRatio="xMidYMid meet">
            <defs>
                <!-- Tallo realista (verde oliva) -->
                <linearGradient id="stemGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                    <stop offset="0%" stop-color="#2f3e23" />
                    <stop offset="50%" stop-color="#4a5d35" />
                    <stop offset="100%" stop-color="#1b2513" />
                </linearGradient>

                <!-- Degradado de pétalos: Naranja a Amarillo Brillante -->
                <radialGradient id="petalBaseGrad" cx="50%" cy="100%" r="100%">
                    <stop offset="0%" stop-color="#b45309" />    <!-- Naranja oscuro/ámbar -->
                    <stop offset="35%" stop-color="#f59e0b" />   <!-- Ámbar vibrante -->
                    <stop offset="75%" stop-color="#fde047" />   <!-- Amarillo claro -->
                    <stop offset="100%" stop-color="#fef08a" />  <!-- Punta amarillo muy claro -->
                </radialGradient>

                <!-- Centro de la flor: Texturizado con verdes y marrones -->
                <radialGradient id="centerCoreGrad" cx="50%" cy="50%" r="50%">
                    <stop offset="0%" stop-color="#65a30d" />    <!-- Verde lima oscuro en el corazón -->
                    <stop offset="40%" stop-color="#78350f" />    <!-- Marrón -->
                    <stop offset="80%" stop-color="#451a03" />    <!-- Marrón muy oscuro -->
                    <stop offset="100%" stop-color="#000000" />   <!-- Borde negro/oscuro -->
                </radialGradient>
                
                <!-- Capullo lateral realista -->
                <radialGradient id="budGrad" cx="30%" cy="30%" r="70%">
                    <stop offset="0%" stop-color="#fde047" />
                    <stop offset="100%" stop-color="#ca8a04" />
                </radialGradient>
            </defs>

            <g id="plant-base">
                <!-- Tallo Principal -->
                <path d="M 250,250 C 270,350 230,500 250,700" 
                      fill="none" stroke="url(#stemGrad)" stroke-width="6" stroke-linecap="round"/>
                
                <!-- Hojas finas y elegantes (estilo cosmos) -->
                <g stroke="url(#stemGrad)" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.9">
                    <path d="M 242,450 Q 200,430 160,460" />
                    <path d="M 220,440 Q 190,410 170,420" />
                    <path d="M 210,447 Q 190,460 170,470" />
                    <path d="M 225,435 Q 200,400 190,390" />
                </g>
                
                <g stroke="url(#stemGrad)" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.9">
                    <path d="M 246,580 Q 280,560 320,590" />
                    <path d="M 270,570 Q 290,540 310,550" />
                    <path d="M 285,580 Q 310,570 330,595" />
                </g>

                <!-- Brote secundario / Capullo -->
                <g id="lateral-bud" transform="translate(0, 0)">
                    <path d="M 253,380 C 280,360 310,340 330,310" 
                          fill="none" stroke="url(#stemGrad)" stroke-width="3" stroke-linecap="round"/>
                    
                    <!-- Sépalos verdes -->
                    <path d="M 330,310 Q 320,290 315,280 Q 330,295 330,310 Z" fill="#3f6212"/>
                    <path d="M 330,310 Q 340,290 345,280 Q 330,295 330,310 Z" fill="#365314"/>
                    <path d="M 330,310 Q 330,285 330,280 Q 330,295 330,310 Z" fill="#203309"/>
                    
                    <!-- Capullos a punto de abrir amarillos -->
                    <path d="M 320,285 Q 310,260 325,255 Q 330,270 325,285 Z" fill="url(#budGrad)"/>
                    <path d="M 340,285 Q 350,260 335,255 Q 330,270 335,285 Z" fill="url(#budGrad)"/>
                    <path d="M 330,280 Q 330,250 330,250 Q 330,265 330,280 Z" fill="#fef08a" stroke="#ca8a04" stroke-width="0.5"/>
                </g>
            </g>

            <!-- Contenedor donde se insertan los pétalos vía JS -->
            <g id="petals-container" transform="translate(250, 250)"></g>

            <!-- Centro texturizado de la flor (tipo cosmos) -->
            <g id="flower-center" transform="translate(250, 250)">
                <!-- Base oscura del disco floral -->
                <circle cx="0" cy="0" r="32" fill="url(#centerCoreGrad)" filter="drop-shadow(0 2px 5px rgba(0,0,0,0.5))"/>
                
                <!-- Anillos de estambres amarillos/marrones -->
                <circle cx="0" cy="0" r="26" fill="none" stroke="#fde047" stroke-width="6" stroke-dasharray="3 6" opacity="0.9"/>
                <circle cx="0" cy="0" r="18" fill="none" stroke="#ca8a04" stroke-width="4" stroke-dasharray="2 4" opacity="0.8"/>
                <circle cx="0" cy="0" r="12" fill="none" stroke="#eab308" stroke-width="3" stroke-dasharray="1.5 3" opacity="0.7"/>
                
                <!-- Núcleo oscuro -->
                <circle cx="0" cy="0" r="6" fill="#14532d" opacity="0.9"/>
                <circle cx="0" cy="0" r="2" fill="#000000"/>
            </g>
        </svg>
    </main>

    <!-- UI Inferior - Botón Fijo -->
    <div class="fixed bottom-8 md:bottom-10 left-1/2 transform -translate-x-1/2 z-50 flex justify-center w-[85%] md:w-auto">
        <button id="add-petal-btn" class="magic-btn px-8 py-4 rounded-full text-white font-semibold text-lg md:text-xl tracking-wider focus:outline-none flex items-center justify-center gap-3 w-full md:w-auto">
            <span class="whitespace-nowrap uppercase text-sm md:text-base text-yellow-50 drop-shadow-[0_1px_2px_rgba(0,0,0,0.5)]">Agregar Pétalo</span>
            <svg class="w-5 h-5 shrink-0 text-yellow-100" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
        </button>
    </div>

    <!-- Modal Romántico de Primavera -->
    <div id="modal-overlay" class="fixed inset-0 z-[100] flex items-center justify-center p-4">
        <!-- Fondo oscuro con blur profundo -->
        <div class="absolute inset-0 bg-black/60 backdrop-blur-md" onclick="closeModal()"></div>
        
        <!-- Tarjeta de mensaje con estilo cristal dorado -->
        <div id="modal-content" class="relative bg-slate-900/80 p-8 md:p-10 max-w-md w-full text-center rounded-2xl border border-yellow-500/30 shadow-[0_0_40px_rgba(234,179,8,0.2)] backdrop-blur-xl">
            <!-- Brillo superior -->
            <div class="absolute top-0 left-1/2 transform -translate-x-1/2 w-3/4 h-1 bg-gradient-to-r from-transparent via-yellow-400 to-transparent opacity-60 rounded-full"></div>
            
            <button onclick="closeModal()" class="absolute top-4 right-5 text-2xl text-gray-400 hover:text-yellow-400 transition-colors focus:outline-none">
                &times;
            </button>
            
            <!-- Icono floral SVG en lugar de emoji -->
            <div class="flex justify-center items-center gap-3 mb-6 text-yellow-400 drop-shadow-[0_0_8px_rgba(253,224,71,0.5)]">
                <svg class="w-8 h-8" viewBox="0 0 24 24" fill="currentColor"><path d="M12 22C12 22 10 16 5 16C2 16 2 11 5 11C8 11 11.5 13.5 12 15C12.5 13.5 16 11 19 11C22 11 22 16 19 16C14 16 12 22 12 22Z"/><path d="M12 2C12 2 10 8 5 8C2 8 2 13 5 13C8 13 11.5 10.5 12 9C12.5 10.5 16 13 19 13C22 13 22 8 19 8C14 8 12 2 12 2Z"/></svg>
            </div>
            
            <p id="modal-text" class="text-lg md:text-xl font-medium leading-relaxed text-yellow-50 italic">
                <!-- El mensaje va aquí -->
            </p>
            
            <div class="mt-8 pt-4 border-t border-yellow-500/20 text-[10px] text-yellow-200/50 uppercase tracking-[0.3em]">
                Mensaje de Primavera
            </div>
        </div>
    </div>

    <script>
        // Sistema de chispas/partículas de fondo
        const sparksContainer = document.getElementById('sparks');
        for(let i=0; i<40; i++) {
            let spark = document.createElement('div');
            spark.className = 'spark';
            spark.style.left = `${Math.random() * 100}%`;
            spark.style.width = `${Math.random() * 3 + 1}px`;
            spark.style.height = spark.style.width;
            spark.style.setProperty('--duration', `${Math.random() * 5 + 4}s`);
            spark.style.setProperty('--max-opacity', `${Math.random() * 0.6 + 0.2}`);
            spark.style.animationDelay = `${Math.random() * 8}s`;
            sparksContainer.appendChild(spark);
        }

        const TOTAL_PETALS = 10;
        let currentPetalCount = 0;
        
        // Las 10 frases neutras y dulces de primavera solicitadas
        const phrases = [
            "Que esta primavera te llene de días bonitos y buena energía.",
            "Feliz primavera. Ojalá hoy te sonría todo.",
            "Que florezcan tus planes y se cumplan tus metas.",
            "Disfruta el sol, las flores y todo lo lindo de hoy.",
            "Que tengas un día alegre, tranquilo y lleno de cosas buenas.",
            "Hoy es un buen día para sonreír. ¡Feliz primavera!",
            "Que esta estación te traiga ideas nuevas y momentos felices.",
            "Espero que tengas un día tan lindo como esta temporada.",
            "Que no te falten motivos para estar feliz. Feliz primavera.",
            "Brilla, disfruta y aprovecha este día de primavera."
        ];

        // Mezclar aleatoriamente el array de frases para que siempre salgan en distinto orden
        const shuffledPhrases = [...phrases].sort(() => Math.random() - 0.5);

        // Rutas SVG para la forma de los pétalos (asimetría realista cosmos)
        const petalPaths = [
            "M 0,0 C -22,-45 -48,-85 -38,-145 C -32,-162 -16,-172 0,-160 C 16,-172 32,-162 38,-145 C 48,-85 22,-45 0,0 Z",
            "M 0,0 C -28,-40 -52,-95 -38,-150 C -28,-172 0,-165 12,-155 C 28,-160 42,-140 32,-115 C 22,-65 16,-35 0,0 Z",
            "M 0,0 C -18,-55 -38,-105 -28,-155 C -22,-178 6,-182 16,-165 C 38,-170 48,-145 42,-120 C 32,-75 16,-45 0,0 Z"
        ];

        // Nervaduras internas de los pétalos para añadir realismo
        const veinPaths = [
            '<path d="M 0,-10 Q -8,-70 -5,-130" stroke="rgba(180,83,9,0.3)" stroke-width="1.5" fill="none"/><path d="M 0,-10 Q 8,-70 5,-120" stroke="rgba(180,83,9,0.2)" stroke-width="1" fill="none"/>',
            '<path d="M -3,-10 Q -15,-60 -10,-120" stroke="rgba(180,83,9,0.25)" stroke-width="1" fill="none"/><path d="M 3,-10 Q 15,-60 12,-110" stroke="rgba(180,83,9,0.25)" stroke-width="1" fill="none"/><path d="M 0,-5 L 0,-135" stroke="rgba(180,83,9,0.35)" stroke-width="1.5" fill="none"/>'
        ];

        const petalsContainer = document.getElementById('petals-container');
        const btnAdd = document.getElementById('add-petal-btn');
        const progressBar = document.getElementById('progress-bar');
        const progressText = document.getElementById('progress-text');
        
        const modalOverlay = document.getElementById('modal-overlay');
        const modalText = document.getElementById('modal-text');
        
        // Control de estado
        let isFlowerComplete = false;

        function openModal(message) {
            if(!isFlowerComplete) return; // Solo abre si la flor está completa
            modalText.textContent = message;
            modalOverlay.classList.add('active');
        }

        function closeModal() {
            modalOverlay.classList.remove('active');
        }

        function createSVGElement(tag) {
            return document.createElementNS("http://www.w3.org/2000/svg", tag);
        }

        function createPetal(index, message) {
            const angle = (index * (360 / TOTAL_PETALS)) + (Math.random() * 8 - 4);
            const pathVariant = petalPaths[Math.floor(Math.random() * petalPaths.length)];
            const veinVariant = veinPaths[Math.floor(Math.random() * veinPaths.length)];

            const wrapper = createSVGElement('g');
            wrapper.setAttribute('class', 'petal-group');
            wrapper.setAttribute('style', `transform: rotate(${angle}deg) scale(0);`);
            
            // Asignar evento click
            wrapper.addEventListener('click', () => openModal(message));

            // Dibujo del pétalo
            const pathNode = createSVGElement('path');
            pathNode.setAttribute('class', 'petal-shape');
            pathNode.setAttribute('d', pathVariant);
            pathNode.setAttribute('fill', 'url(#petalBaseGrad)');
            pathNode.setAttribute('stroke', '#d97706'); // Borde sutil naranja/dorado
            pathNode.setAttribute('stroke-width', '0.5');
            wrapper.appendChild(pathNode);

            // Agregar textura de nervaduras
            const veinsGroup = createSVGElement('g');
            veinsGroup.innerHTML = veinVariant;
            wrapper.appendChild(veinsGroup);

            // Indicador luminoso que aparecerá cuando esté completo
            const indicator = createSVGElement('circle');
            indicator.setAttribute('class', 'link-indicator');
            indicator.setAttribute('cx', '0');
            indicator.setAttribute('cy', '-120');
            indicator.setAttribute('r', '4');
            indicator.setAttribute('fill', '#fef08a');
            wrapper.appendChild(indicator);

            return wrapper;
        }

        btnAdd.addEventListener('click', () => {
            if (currentPetalCount < TOTAL_PETALS) {
                const phraseForThisPetal = shuffledPhrases[currentPetalCount];
                const newPetal = createPetal(currentPetalCount, phraseForThisPetal);
                
                petalsContainer.appendChild(newPetal);
                
                // Forzar reflujo para que la transición CSS funcione
                void newPetal.offsetWidth; 
                newPetal.classList.add('bloom');
                newPetal.style.transform = `rotate(${newPetal.style.transform.match(/rotate\(([^)]+)\)/)[1]}) scale(1)`;

                currentPetalCount++;
                
                // Actualizar interfaz
                progressBar.style.width = `${(currentPetalCount / TOTAL_PETALS) * 100}%`;
                progressText.textContent = `${currentPetalCount} / ${TOTAL_PETALS} PÉTALOS`;

                // Verificar si se completó la flor
                if (currentPetalCount === TOTAL_PETALS) {
                    isFlowerComplete = true;
                    
                    // Cambiar apariencia del botón
                    btnAdd.disabled = true;
                    btnAdd.innerHTML = `<span class="uppercase tracking-widest text-sm text-yellow-200">¡Flor Completa!</span>`;
                    btnAdd.classList.replace('magic-btn', 'bg-slate-800');
                    btnAdd.style.border = '1px solid #78350f';
                    btnAdd.style.boxShadow = 'none';
                    
                    // Activar el estado completo
                    document.getElementById('flower-svg').classList.add('flower-complete');
                    
                    // Lanzar confeti con colores dorados y amarillos
                    setTimeout(() => {
                        const duration = 3000;
                        const end = Date.now() + duration;

                        (function frame() {
                            confetti({
                                particleCount: 5,
                                angle: 60,
                                spread: 55,
                                origin: { x: 0 },
                                colors: ['#fde047', '#fef08a', '#eab308', '#ffffff']
                            });
                            confetti({
                                particleCount: 5,
                                angle: 120,
                                spread: 55,
                                origin: { x: 1 },
                                colors: ['#fde047', '#fef08a', '#eab308', '#ffffff']
                            });

                            if (Date.now() < end) {
                                requestAnimationFrame(frame);
                            }
                        }());
                    }, 400);
                }
            }
        });
    </script>
</body>
</html>
