<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Flor Amarilla</title>
  <style>
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background: #e0f7fa;
      font-family: Arial, sans-serif;
    }

    .flor {
      position: relative;
      width: 200px;
      height: 300px;
    }

    .centro {
      position: absolute;
      width: 60px;
      height: 60px;
      background: orange;
      border-radius: 50%;
      top: 40px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 2;
    }

    .petalo {
      position: absolute;
      width: 80px;
      height: 120px;
      background: yellow;
      border-radius: 50% 50% 50% 50%;
      top: 40px;
      left: 50%;
      transform-origin: center 80px;
      opacity: 0;
      transition: opacity 0.6s ease, transform 0.6s ease;
      z-index: 1;
    }

    .tallo {
      position: absolute;
      width: 10px;
      height: 200px;
      background: green;
      top: 100px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 0;
    }

    .hoja {
      position: absolute;
      width: 60px;
      height: 30px;
      background: green;
      border-radius: 50%;
      top: 180px;
      left: 50%;
      transform: translateX(-120%) rotate(-20deg);
    }

    .hoja2 {
      position: absolute;
      width: 60px;
      height: 30px;
      background: green;
      border-radius: 50%;
      top: 220px;
      left: 50%;
      transform: translateX(20%) rotate(20deg);
    }

    button {
      margin-top: 20px;
      padding: 10px 20px;
      font-size: 16px;
      border: none;
      border-radius: 5px;
      background: #ffcc00;
      cursor: pointer;
      transition: background 0.3s;
    }

    button:hover {
      background: #ffaa00;
    }

    /* Responsivo para móviles */
    @media (max-width: 600px) {
      .flor {
        width: 150px;
        height: 250px;
      }
      .centro {
        width: 40px;
        height: 40px;
      }
      .petalo {
        width: 60px;
        height: 90px;
      }
      .tallo {
        height: 150px;
      }
    }
  </style>
</head>
<body>
  <div class="flor" id="flor">
    <div class="centro"></div>
    <div class="tallo"></div>
    <div class="hoja"></div>
    <div class="hoja2"></div>
  </div>
  <button onclick="crecer()">Agregar pétalo</button>

  <script>
    let contador = 0;
    function crecer() {
      if (contador < 6) {
        contador++;
        const flor = document.getElementById("flor");
        const petalo = document.createElement("div");
        petalo.className = "petalo";
        const angulo = (contador - 1) * 60; // distribuye 6 pétalos
        petalo.style.transform = `rotate(${angulo}deg) translate(-50%, -120%)`;
        flor.appendChild(petalo);
        setTimeout(() => {
          petalo.style.opacity = 1;
        }, 50);
      }
    }
  </script>
</body>
</html>
