<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Flor Amarilla en Maceta con Jardín (Responsive)</title>
  <style>
    :root {
      box-sizing: border-box;
    }
    * { box-sizing: inherit; }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background: linear-gradient(to bottom, #90caf9, #e3f2fd 60%, #dcedc8 100%);
      font-family: 'Segoe UI', sans-serif;
      overflow-x: hidden;
      position: relative;
    }

    /* ---------- JARDÍN DE FONDO ---------- */
    .jardin {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 190px;
      background: linear-gradient(to bottom, #9ccc65, #558b2f 90%);
      overflow: hidden;
      z-index: 0;
      box-shadow: inset 0 8px 12px -6px rgba(0,0,0,0.25);
    }

    .mini-flor {
      position: absolute;
      bottom: 8px;
      width: 36px;
      transform-origin: bottom center;
      animation: balanceo 3.6s ease-in-out infinite;
      z-index: 1;
    }

    @keyframes balanceo {
      0%, 100% { transform: rotate(-4deg); }
      50% { transform: rotate(4deg); }
    }

    .mini-tallo {
      position: absolute;
      top: 18px;
      left: 50%;
      width: 4px;
      height: calc(100% - 18px);
      background: linear-gradient(to top, #2e7d32, #689f38);
      transform: translateX(-50%);
      border-radius: 3px;
    }

    .mini-centro {
      position: absolute;
      top: 18px;
      left: 50%;
      width: 12px;
      height: 12px;
      background: radial-gradient(circle, #fff59d, #fbc02d);
      border-radius: 50%;
      transform: translate(-50%, -50%);
      z-index: 3;
    }

    .mini-petalo {
      position: absolute;
      top: 0;
      left: 50%;
      width: 9px;
      height: 18px;
      margin-left: -4.5px;
      border-radius: 50%;
      background: radial-gradient(circle at 50% 25%, var(--color-claro), var(--color-oscuro));
      transform-origin: bottom center;
      z-index: 2;
    }

    .mini-petalo:nth-child(3) { transform: rotate(0deg); }
    .mini-petalo:nth-child(4) { transform: rotate(72deg); }
    .mini-petalo:nth-child(5) { transform: rotate(144deg); }
    .mini-petalo:nth-child(6) { transform: rotate(216deg); }
    .mini-petalo:nth-child(7) { transform: rotate(288deg); }

    /* ---------- FLOR PRINCIPAL ---------- */
    .flor {
      position: relative;
      width: 200px;
      height: 430px;
      transform: scale(1.3);
      margin-top: 90px;
      margin-bottom: 40px;
      transition: transform 0.3s ease;
      z-index: 2;
    }

    @media (min-width: 768px) {
      .flor {
        transform: scale(1.8);
        margin-top: 170px;
        margin-bottom: 120px;
      }
    }

    .tallo {
      position: absolute;
      width: 14px;
      height: 220px;
      background: linear-gradient(to right, #2e7d32, #1b5e20);
      top: 100px;
      left: 50%;
      transform: translateX(-50%);
      border-radius: 6px;
    }

    .hoja, .hoja2 {
      position: absolute;
      width: 60px;
      height: 60px;
      background: linear-gradient(45deg, #43a047, #2e7d32);
      border-radius: 0 50% 0 50%;
    }

    .hoja {
      top: 160px;
      left: 50%;
      transform: translateX(-100%) rotate(-15deg);
    }

    .hoja2 {
      top: 200px;
      left: 50%;
      transform: translateX(0%) rotate(75deg);
    }

    .centro {
      position: absolute;
      width: 80px;
      height: 80px;
      background: radial-gradient(circle, #ffb300 30%, #e65100 80%);
      border-radius: 50%;
      top: 100px;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 3;
      box-shadow: inset 0 0 10px rgba(0,0,0,0.2), 0 4px 8px rgba(0,0,0,0.3);
    }

    .petalo {
      position: absolute;
      width: 50px;
      height: 100px;
      background: radial-gradient(circle at 50% 20%, #fff176, #fbc02d);
      border-radius: 50% 50% 20% 20%;
      top: 0px;
      left: 50%;
      margin-left: -25px;
      transform-origin: bottom center;
      opacity: 0;
      transition: opacity 0.5s ease, transform 0.5s ease;
      z-index: 1;
      border: 1px solid #f9a825;
    }

    /* ---------- MACETA ---------- */
    .maceta-borde {
      position: absolute;
      width: 130px;
      height: 22px;
      top: 310px;
      left: 50%;
      transform: translateX(-50%);
      background: linear-gradient(to bottom, #ff8a65, #d84315);
      border-radius: 10px;
      z-index: 3;
      box-shadow: 0 3px 4px rgba(0,0,0,0.25);
    }

    .maceta {
      position: absolute;
      width: 110px;
      height: 90px;
      top: 325px;
      left: 50%;
      transform: translateX(-50%);
      background: linear-gradient(to bottom, #bf360c, #8d2c0a);
      clip-path: polygon(8% 0%, 92% 0%, 100% 100%, 0% 100%);
      z-index: 2;
      box-shadow: inset -8px 0 12px rgba(0,0,0,0.25);
    }

    button {
      position: relative;
      z-index: 10;
      margin-top: 10px;
      margin-bottom: 40px;
      padding: 15px 30px;
      font-size: 20px;
      font-weight: bold;
      color: #333;
      border: 2px solid #f9a825;
      border-radius: 8px;
      background: linear-gradient(to bottom, #ffeb3b, #fbc02d);
      cursor: pointer;
      box-shadow: 0 4px 6px rgba(0,0,0,0.2);
      transition: transform 0.2s, box-shadow 0.2s;
    }

    button:hover {
      transform: scale(1.05);
      box-shadow: 0 6px 12px rgba(0,0,0,0.3);
    }
  </style>
</head>

  <div class="flor" id="flor">

    <div class="hoja"></div>

    <div class="maceta-borde"></div>
    <div class="maceta"></div>
  </div>

  <button onclick="crecer()">Agregar pétalo</button>

  <script>
    let contador = 0;
    const totalPetalos = 10;

    function crecer() {
      if (contador < totalPetalos) {
        const flor = document.getElementById("flor");
        const petalo = document.createElement("div");
        petalo.className = "petalo";

        const angulo = contador * (360 / totalPetalos);
        petalo.style.transform = `rotate(${angulo}deg) scale(0)`;

        flor.appendChild(petalo);

        setTimeout(() => {
          petalo.style.opacity = 1;
          petalo.style.transform = `rotate(${angulo}deg) scale(1)`;
        }, 50);

        contador++;
      }
    }
  </script>
