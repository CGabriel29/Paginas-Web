<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Flor Amarilla Animada</title>
  <style>
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background: linear-gradient(to top, #a8e6cf, #dcedc1);
      font-family: 'Segoe UI', sans-serif;
    }

    .flor {
      position: relative;
      width: 200px;
      height: 300px;
      animation: girar 20s linear infinite;
    }

    @keyframes girar {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .tallo {
      position: absolute;
      width: 12px;
      height: 200px;
      background: linear-gradient(to bottom, #2e7d32, #1b5e20);
      top: 100px;
      left: 50%;
      transform: translateX(-50%);
      border-radius: 6px;
    }

    .hoja, .hoja2 {
      position: absolute;
      width: 70px;
      height: 40px;
      background: linear-gradient(to right, #43a047, #2e7d32);
      border-radius: 50%;
    }

    .hoja {
      top: 180px;
      left: 50%;
      transform: translateX(-120%) rotate(-20deg);
    }

    .hoja2 {
      top: 220px;
      left: 50%;
      transform: translateX(20%) rotate(20deg);
    }

    .centro {
      position: absolute;
      width: 70px;
      height: 70px;
      background: radial-gradient(circle, #ffb300 30%, #f57c00 70%);
      border-radius: 50%;
      top: 40px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 2;
      box-shadow: 0 0 15px rgba(0,0,0,0.2);
    }

    .petalo {
      position: absolute;
      width: 80px;
      height: 120px;
      background: radial-gradient(circle at 30% 30%, #fff176, #fbc02d);
      border-radius: 50%;
      top: 40px;
      left: 50%;
      transform-origin: center 80px;
      opacity: 0;
      transition: opacity 0.8s ease, transform 0.8s ease;
      z-index: 1;
      box-shadow: 0 0 10px rgba(0,0,0,0.15);
    }

    button {
      margin-top: 20px;
      padding: 12px 24px;
      font-size: 18px;
      border: none;
      border-radius: 8px;
      background: linear-gradient(to bottom, #ffeb3b, #fbc02d);
      cursor: pointer;
      box-shadow: 0 4px 6px rgba(0,0,0,0.2);
      transition: transform 0.2s;
    }

    button:hover {
      transform: scale(1.05);
    }

    @media (max-width: 600px) {
      .flor {
        width: 150px;
        height: 250px;
      }
      .centro {
        width: 50px;
        height: 50px;
      }
      .petalo {
        width: 60px;
        height: 90px;
      }
      .tallo {
        height: 150px;
      }
    }
  </style>
</head>
<body>
  <div class="flor" id="flor">
    <div class="tallo"></div>
    <div class="hoja"></div>
    <div class="hoja2"></div>
    <div class="centro"></div>
  </div>
  <button onclick="crecer()">Agregar pétalo</button>

  <script>
    let contador = 0;
    function crecer() {
      if (contador < 6) {
        contador++;
        const flor = document.getElementById("flor");
        const petalo = document.createElement("div");
        petalo.className = "petalo";
        const angulo = (contador - 1) * 60;
        petalo.style.transform = `rotate(${angulo}deg) translate(-50%, -130%) scale(1.1)`;
        flor.appendChild(petalo);
        setTimeout(() => {
          petalo.style.opacity = 1;
        }, 100);
      }
    }
  </script>
</body>
</html>
