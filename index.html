<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Flor Amarilla</title>
  <style>
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background: #f0f8ff;
      font-family: Arial, sans-serif;
    }

    .flor {
      position: relative;
      width: 150px;
      height: 150px;
      margin-bottom: 20px;
    }

    .centro {
      position: absolute;
      width: 50px;
      height: 50px;
      background: orange;
      border-radius: 50%;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 2;
    }

    .petalo {
      position: absolute;
      width: 60px;
      height: 90px;
      background: yellow;
      border-radius: 50% 50% 50% 50%;
      top: 50%;
      left: 50%;
      transform-origin: center -20px;
      opacity: 0;
      transition: opacity 0.5s ease, transform 0.5s ease;
    }

    button {
      padding: 10px 20px;
      font-size: 16px;
      border: none;
      border-radius: 5px;
      background: #ffcc00;
      cursor: pointer;
      transition: background 0.3s;
    }

    button:hover {
      background: #ffaa00;
    }

    /* Responsivo para móviles */
    @media (max-width: 600px) {
      .flor {
        width: 120px;
        height: 120px;
      }
      .centro {
        width: 40px;
        height: 40px;
      }
      .petalo {
        width: 50px;
        height: 70px;
      }
    }
  </style>
</head>
<body>
  <div class="flor" id="flor">
    <div class="centro"></div>
  </div>
  <button onclick="crecer()">Agregar pétalo</button>

  <script>
    let contador = 0;
    function crecer() {
      if (contador < 4) {
        contador++;
        const flor = document.getElementById("flor");
        const petalo = document.createElement("div");
        petalo.className = "petalo";
        // Distribuir pétalos en 4 direcciones (0°, 90°, 180°, 270°)
        const angulo = contador * 90;
        petalo.style.transform = `rotate(${angulo}deg) translate(-50%, -120%)`;
        flor.appendChild(petalo);
        setTimeout(() => {
          petalo.style.opacity = 1;
        }, 50);
      }
    }
  </script>
</body>
</html>
